server:
  port: ${PORT:8080}

spring:
  application:
    name: reverse-otp-service
  profiles:
    active: dev

app:
  token:
    ttl-minutes: 5
    request-id-length: 16
    suffix-length: 48

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
